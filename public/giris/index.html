<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EkoMatch — Açılış</title>
  <style>
    :root { color-scheme: dark; background: #000; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
    canvas { display: block; width: 100%; height: 100%; }
    audio { display: none; }
    #subtitle { position: fixed; z-index: 4; left: 50%; bottom: 5.5vh; width: min(90vw, 1500px); transform: translateX(-50%); padding: 18px 28px; color: #fff; background: rgba(2, 7, 10, .7); text-align: center; font-size: clamp(20px, 1.9vw, 36px); line-height: 1.35; opacity: 0; transition: opacity .2s ease; pointer-events: none; }
    #subtitle.on { opacity: 1; }
    #debug { position: fixed; z-index: 5; top: 18px; right: 18px; min-width: 190px; display: none; padding: 10px 12px; border: 1px solid rgba(243,247,247,.18); color: #d7e9e9; background: rgba(3,10,15,.78); font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none; }
    #debug.on { display: block; }
    .opening-controls { position: fixed; z-index: 6; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 6px; }
    .opening-controls button { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 6px 9px; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; background: rgba(11,22,32,.25); color: #fff; font: 11px/1.2 inherit; font-size: 11px; cursor: pointer; opacity: .2; transition: opacity .2s ease, background .2s ease; }
    .opening-controls button:hover, .opening-controls button:focus-visible { opacity: .85; background: rgba(11,22,32,.7); }
    .opening-controls button:focus-visible { outline: 2px solid #02ABBF; outline-offset: 3px; }
    .transition-complete .opening-controls { display: none; }
    .opening-controls svg { width: 13px; height: 13px; }
  </style>
</head>
<body aria-label="EkoMatch seslendirmeli açılış animasyonu">
  <canvas id="stage" aria-hidden="true"></canvas>
  <div id="subtitle" aria-live="polite"></div>
  <div id="debug"></div>
  <div class="opening-controls" role="group" aria-label="Açılış kontrolleri">
    <button id="restart" type="button" title="Açılışı başa sar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6" /></svg>Başa sar</button>
    <button id="pause" type="button" title="Açılışı oynat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 4 12 8-12 8V4Z" /></svg><span>Devam et</span></button>
    <button id="skip" type="button" title="Açılışı atla ve sunuma geç"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 4 12 8-12 8V4ZM20 4v16" /></svg>Atla</button>
    <button id="fullscreen" type="button" title="Tam ekran (F)" aria-label="Tam ekran" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5" /></svg><span>Tam ekran</span></button>
  </div>
  <audio id="voice" preload="auto" src="ekomatch_seslendirme.mp3"></audio>
  <audio id="music" preload="auto" src="music.mp3"></audio>
  <script>
    (() => {
      'use strict'

      const W = 1920, H = 1080, TRANSITION = .62
      const COLORS = { bg: '#0B1620', center: '#13283B', white: '#F3F7F7', orange: '#EF8A3C', aqua: '#36D9E6', mid: '#05AA6A', green: '#5AC526' }
      const NETWORK_NODE_COUNT = 64, NEW_EDGE_COUNT = 12
      const OPENING_PAIRS = [[0,1],[2,3],[4,5]]
      const canvas = document.querySelector('#stage')
      const ctx = canvas.getContext('2d', { alpha: false })
      const voice = document.querySelector('#voice')
      const music = document.querySelector('#music')
      const subtitle = document.querySelector('#subtitle')
      const debug = document.querySelector('#debug')
      const pauseButton = document.querySelector('#pause')
      const fullscreenButton = document.querySelector('#fullscreen')
      // Fullscreen the presentation document so it persists after the opening iframe closes.
      let fullscreenDocument = document
      try { fullscreenDocument = window.parent.document } catch {}
      const isFullscreen = () => Boolean(fullscreenDocument.fullscreenElement || fullscreenDocument.webkitFullscreenElement)
      function updateFullscreenButton() {
        const active = isFullscreen()
        const label = active ? 'Tam ekrandan çık' : 'Tam ekran'
        fullscreenButton.querySelector('span').textContent = label
        fullscreenButton.title = `${label} (F)`
        fullscreenButton.setAttribute('aria-label', label)
        fullscreenButton.setAttribute('aria-pressed', String(active))
        fullscreenButton.querySelector('path').setAttribute('d', active ? 'M3 8h5V3M21 8h-5V3M16 21v-5h5M3 16h5v5' : 'M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5')
      }
      async function toggleFullscreen() {
        try {
          if (isFullscreen()) {
            if (fullscreenDocument.exitFullscreen) await fullscreenDocument.exitFullscreen()
            else fullscreenDocument.webkitExitFullscreen?.()
          } else {
            const element = fullscreenDocument.documentElement
            if (element.requestFullscreen) await element.requestFullscreen()
            else element.webkitRequestFullscreen?.()
          }
        } catch {}
        updateFullscreenButton()
      }
      fullscreenDocument.addEventListener('fullscreenchange', updateFullscreenButton)
      fullscreenDocument.addEventListener('webkitfullscreenchange', updateFullscreenButton)
      addEventListener('pagehide', () => {
        fullscreenDocument.removeEventListener('fullscreenchange', updateFullscreenButton)
        fullscreenDocument.removeEventListener('webkitfullscreenchange', updateFullscreenButton)
      }, { once: true })
      fullscreenButton.addEventListener('click', event => { event.stopPropagation(); toggleFullscreen() })
      updateFullscreenButton()

      function updatePauseButton() {
        const paused = voice.paused
        pauseButton.querySelector('span').textContent = paused ? 'Devam et' : 'Durdur'
        pauseButton.title = paused ? 'Açılışı oynat' : 'Açılışı durdur'
        pauseButton.querySelector('path').setAttribute('d', paused ? 'm6 4 12 8-12 8V4Z' : 'M8 4v16M16 4v16')
      }
      voice.addEventListener('play',updatePauseButton)
      voice.addEventListener('pause',updatePauseButton)
      const logoImage = new Image()
      logoImage.src = 'logo.png'
      let darkLogo = null, ready = Promise.resolve()
      const logoReady = logoImage.decode().then(async () => {
        const image = new Image()
        image.src = 'logo_koyu.png'
        try { await image.decode(); darkLogo = image }
        catch {
          const copy = document.createElement('canvas')
          copy.width = logoImage.naturalWidth; copy.height = logoImage.naturalHeight
          const g = copy.getContext('2d'); g.drawImage(logoImage, 0, 0)
          const pixels = g.getImageData(0, 0, copy.width, copy.height)
          for (let i = 0; i < pixels.data.length; i += 4) {
            if (pixels.data[i] > 225 && pixels.data[i+1] > 225 && pixels.data[i+2] > 225) {
              pixels.data[i] = 19; pixels.data[i+1] = 40; pixels.data[i+2] = 59
            }
          }
          g.putImageData(pixels, 0, 0); darkLogo = copy
        }
      })
      function parentCoverLogo() {
        try { return window.parent !== window ? window.parent.document.querySelector('.deck-cover-brand img') : null }
        catch { return null }
      }
      const coverLogo = new Image()
      coverLogo.src = parentCoverLogo()?.src || 'logo_kapak.png'
      let openingLogoBounds = null, coverLogoBounds = null
      function imageBounds(image) {
        const c=document.createElement('canvas');c.width=image.naturalWidth||image.width;c.height=image.naturalHeight||image.height
        const g=c.getContext('2d');g.drawImage(image,0,0)
        const data=g.getImageData(0,0,c.width,c.height).data
        let left=c.width,top=c.height,right=0,bottom=0
        for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(data[(y*c.width+x)*4+3]>0){left=Math.min(left,x);top=Math.min(top,y);right=Math.max(right,x+1);bottom=Math.max(bottom,y+1)}
        return {x:left,y:top,width:right-left,height:bottom-top}
      }
      const coverReady=Promise.all([logoReady,coverLogo.decode()]).then(()=>{
        openingLogoBounds=imageBounds(logoImage);coverLogoBounds=imageBounds(coverLogo)
      })
      let cues = null, scenes = [], sceneById = new Map(), nodes = [], edges = [], newEdges = [], particles = [], gaps = [], chainSets = [], meshFaces = []
      let sprites = {}, started = false, ended = false, debugOn = false, subtitleOn = false, musicOn = true
      let frameCount = 0, fps = 60, fpsAt = performance.now(), lastFrame = performance.now()

      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v))
      const lerp = (a, b, p) => a + (b - a) * p
      const easeInOut = p => { p = clamp(p); return p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2 }
      const fadeWindow = (p, edge = .18) => easeInOut(clamp(p / edge))
      const colorRgb = color => color.startsWith('#') ? [1,3,5].map(i => parseInt(color.slice(i,i+2),16)) : color.match(/[\d.]+/g).slice(0,3).map(Number)
      const mixColor = (a, b, p, alpha = 1) => { const A = colorRgb(a), B = colorRgb(b); return `rgba(${A.map((v,i) => Math.round(lerp(v,B[i],p))).join(',')},${alpha})` }


      function makeGlow(color) {
        const c = document.createElement('canvas'), size = 96
        c.width = c.height = size
        const g = c.getContext('2d'), gradient = g.createRadialGradient(48,48,0,48,48,48)
        gradient.addColorStop(0, color)
        gradient.addColorStop(.12, color)
        gradient.addColorStop(.34, color.replace('1)', '.32)'))
        gradient.addColorStop(1, color.replace('1)', '0)'))
        g.fillStyle = gradient; g.fillRect(0,0,size,size)
        return c
      }

      function prepareSprites() {
        sprites = {
          white: makeGlow('rgba(243,247,247,1)'), aqua: makeGlow('rgba(54,217,230,1)'),
          green: makeGlow('rgba(90,197,38,1)'), orange: makeGlow('rgba(239,138,60,1)')
        }
      }

      // Delaunay triangles give the reference's connected mesh without a map silhouette.
      function triangulate(points) {
        const vertices = [...points, {x:-6000,y:-4000},{x:8000,y:-4000},{x:960,y:8000}]
        const count=points.length
        let triangles=[[count,count+1,count+2]]
        const circleContains = (triangle,p) => {
          const [a,b,c]=triangle.map(i=>vertices[i]),d=2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y))
          if(Math.abs(d)<.0001)return false
          const aa=a.x*a.x+a.y*a.y,bb=b.x*b.x+b.y*b.y,cc=c.x*c.x+c.y*c.y
          const x=(aa*(b.y-c.y)+bb*(c.y-a.y)+cc*(a.y-b.y))/d
          const y=(aa*(c.x-b.x)+bb*(a.x-c.x)+cc*(b.x-a.x))/d
          return (p.x-x)**2+(p.y-y)**2 < (a.x-x)**2+(a.y-y)**2-.001
        }
        for(let i=0;i<count;i++) {
          const bad=triangles.filter(triangle=>circleContains(triangle,vertices[i])),boundary=new Map()
          bad.forEach(([a,b,c])=>[[a,b],[b,c],[c,a]].forEach(([a,b])=>{
            const key=a<b?`${a}-${b}`:`${b}-${a}`
            if(boundary.has(key))boundary.delete(key);else boundary.set(key,[a,b])
          }))
          triangles=triangles.filter(triangle=>!bad.includes(triangle))
          boundary.forEach(([a,b])=>triangles.push([a,b,i]))
        }
        return triangles.filter(triangle=>triangle.every(i=>i<count))
      }

      function buildNetwork() {
        // Spacious authored positions, softly staggered into an open cloud rather than a border.
        nodes = [
          {x:810,y:475,business:false}, {x:1010,y:440,business:true},
          {x:875,y:610,business:false}, {x:1090,y:630,business:false},
          {x:1170,y:590,business:true}, {x:970,y:545,business:false},
        ]
        const rows = [
          [145,[495,710,920,1145,1355]],
          [250,[310,495,690,880,1070,1270,1480,1625]],
          [390,[210,390,565,760,950,1135,1320,1510,1720]],
          [540,[175,350,540,725,1285,1465,1650,1760]],
          [685,[225,395,580,765,970,1175,1370,1555,1730]],
          [815,[315,515,710,920,1130,1320,1510,1650]],
          [940,[490,680,885,1110,1300,1450]],
        ]
        rows.forEach(([y,xs],row)=>xs.forEach((x,column)=>{
          const index=nodes.length
          nodes.push({x:x+Math.sin(index*2.31)*23,y:y+Math.cos(index*1.73)*24,business:false})
        }))
        ;[[310,155],[1575,170],[185,825],[1730,825],[865,355]].forEach(([x,y])=>nodes.push({x,y,business:false}))
        const closest=(x,y,exclude=[])=>nodes.map((n,i)=>({i,d:exclude.includes(i)?Infinity:Math.hypot(n.x-x,n.y-y)})).sort((a,b)=>a.d-b.d)[0].i
        const chainTargets=[[[390,390],[560,540],[690,250]],[[430,685],[710,815],[970,685]],
          [[880,250],[1070,250],[1270,250]],[[1320,390],[1465,540],[1650,540]],
          [[1370,685],[1510,815],[1650,815]],[[710,815],[920,815],[1130,815]]]
        const assigned=new Set([2,1,4])
        chainSets=[[2,1,4],...chainTargets.map(targets=>{
          const ids=[];targets.forEach(([x,y])=>ids.push(closest(x,y,[...assigned,...ids])))
          ids.forEach(id=>assigned.add(id))
          nodes[ids[1]].business=true;nodes[ids[2]].business=true
          return ids
        })]
        nodes.forEach((n,i)=>{
          n.phase=n.x/W*2+n.y/H*.7
          n.outside=(n.x<540||n.x>1390)
          n.beacon=n.business||i===2||[8,12,22,30,43,53].includes(i)
          n.reveal=i<6?0:clamp((Math.hypot(n.x-960,n.y-540)-70)/880)
          n.edgeFade=clamp(Math.min(n.x-95,1825-n.x,n.y-65,1020-n.y)/150,.35,1)
        })
        const triangles=triangulate(nodes),segments=new Map(),keyFor=(a,b)=>a<b?`${a}-${b}`:`${b}-${a}`
        triangles.forEach(([a,b,c])=>[[a,b],[b,c],[c,a]].forEach(([a,b])=>{
          const key=keyFor(a,b),old=segments.get(key)
          if(old)old.count++;else segments.set(key,{a,b,count:1})
        }))
        const gapPairs=[[2,1],[1,4],...chainSets.slice(1).map(chain=>[chain[0],chain[1]])]
        const reserved=new Set(gapPairs.map(([a,b])=>keyFor(a,b)))
        edges=[];newEdges=[]
        const used=new Set(),addEdge=(a,b,isNew=false,kind='mesh')=>{
          const key=keyFor(a,b);if(a===b||used.has(key))return
          used.add(key)
          const midX=(nodes[a].x+nodes[b].x)/2
          ;(isNew?newEdges:edges).push({a,b,kind,bend:0,
            reveal:isNew?newEdges.length/NEW_EDGE_COUNT:Math.max(nodes[a].reveal,nodes[b].reveal),
            center:midX>650&&midX<1270,outer:Boolean(nodes[a].outside||nodes[b].outside)})
        }
        OPENING_PAIRS.forEach(([a,b])=>addEdge(a,b,false,'core'))
        // Hide convex-hull edges: no enclosing outline, country border or perimeter ring.
        const interior=[...segments.values()].filter(e=>e.count===2&&!reserved.has(keyFor(e.a,e.b)))
        interior.forEach((e,i)=>addEdge(e.a,e.b,i%11===5&&newEdges.length<NEW_EDGE_COUNT))
        // Keep every point attached, even at the soft perimeter.
        nodes.forEach((n,i)=>{
          if(edges.some(e=>e.a===i||e.b===i))return
          const neighbor=nodes.map((other,j)=>({j,d:i===j||reserved.has(keyFor(i,j))?Infinity:Math.hypot(n.x-other.x,n.y-other.y)})).sort((a,b)=>a.d-b.d)[0].j
          addEdge(i,neighbor)
        })
        const established=new Set(edges.map(e=>keyFor(e.a,e.b)))
        meshFaces=triangles.filter(([a,b,c])=>[[a,b],[b,c],[c,a]].every(([a,b])=>established.has(keyFor(a,b)))).map((ids,i)=>({ids,alpha:.05+(i%5)*.015,reveal:Math.max(...ids.map(id=>nodes[id].reveal))}))
        const outwardEdges=edges.map((e,i)=>e.outer?i:-1).filter(i=>i>=0)
        particles=Array.from({length:16},(_,i)=>({edge:outwardEdges[(i*7)%outwardEdges.length],phase:(i*.618)%1,speed:.055+(i%4)*.012}))
        gaps=gapPairs.slice(0,6).map(([a,b])=>({a,b,x:(nodes[a].x+nodes[b].x)/2,y:(nodes[a].y+nodes[b].y)/2,r:Math.min(95,Math.hypot(nodes[a].x-nodes[b].x,nodes[a].y-nodes[b].y)*.4),ring:[a,b]}))
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2)
        canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr)
        canvas.style.width = `${innerWidth}px`; canvas.style.height = `${innerHeight}px`
      }

      function logicalTransform() {
        // Fill the viewport proportionally, cropping the outer edges instead of adding black bars.
        const dpr = canvas.width / innerWidth, scale = Math.max(innerWidth/W, innerHeight/H)
        const ox = (innerWidth-W*scale)/2, oy = (innerHeight-H*scale)/2
        ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy)
      }

      function background(intensity = 1, transition = 0) {
        ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height)
        logicalTransform()
        const g = ctx.createRadialGradient(960,500,20,960,540,920)
        g.addColorStop(0, mixColor(COLORS.center, '#ACBFB7', transition)); g.addColorStop(.62, mixColor(COLORS.bg, '#ACBFB7', transition)); g.addColorStop(1, mixColor('#050B10', '#ACBFB7', transition))
        ctx.globalAlpha = intensity; ctx.fillStyle = g; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1
        const v = ctx.createRadialGradient(960,540,430,960,540,1110)
        v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,`rgba(0,0,0,${.64*(1-transition)})`)
        ctx.fillStyle = v; ctx.fillRect(0,0,W,H)
      }

      function pointAt(i, t, freeze = false, outside = 0) {
        const n = nodes[i], phase = n.phase || i * .77
        const drift = freeze ? 0 : 1
        // Local groups breathe together; connections keep a stable, deliberate shape.
        let x = n.x + Math.sin(t*.17 + phase) * 3 * drift, y = n.y + Math.cos(t*.13 + phase) * 2 * drift
        if (outside && n.outside) {
          const dx=x-960, dy=y-540, len=Math.hypot(dx,dy)||1
          x += dx/len * outside*90; y += dy/len * outside*60
        }
        return { x, y }
      }

      function glow(x,y,size,sprite,alpha=1) { ctx.globalAlpha = alpha; ctx.drawImage(sprite,x-size/2,y-size/2,size,size); ctx.globalAlpha = 1 }
      function nodeDot(i,t,alpha=1,color=COLORS.white,outside=0,freeze=false,glowStrength=1) {
        const n=nodes[i],p=pointAt(i,t,freeze,outside),r=n.business?7:n.beacon?5.5:4
        const sprite=color===COLORS.orange?sprites.orange:color===COLORS.green?sprites.green:sprites.aqua
        const energy=(n.beacon?.65:.10)*glowStrength
        const pulse=freeze?1:.88+.12*Math.sin(t*1.1+n.phase*3)
        glow(p.x,p.y,n.beacon?76:28,sprite,alpha*energy*pulse)
        if(n.beacon&&glowStrength>0){
          ctx.save();ctx.strokeStyle=color;ctx.globalAlpha=alpha*.25*glowStrength;ctx.lineWidth=1.2
          ctx.beginPath();ctx.moveTo(p.x-17,p.y);ctx.lineTo(p.x+17,p.y);ctx.moveTo(p.x,p.y-17);ctx.lineTo(p.x,p.y+17);ctx.stroke();ctx.restore()
        }
        ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill()
        if(n.business){ctx.strokeStyle=color;ctx.globalAlpha=alpha*.72;ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(p.x,p.y,r+6,0,Math.PI*2);ctx.stroke()}
        ctx.globalAlpha=1
      }

      function edgePoint(edge,t,q,outside=0,freeze=false) {
        const a=pointAt(edge.a,t,freeze,outside), b=pointAt(edge.b,t,freeze,outside)
        const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,bend=edge.bend||0
        const c={x:(a.x+b.x)/2-dy/len*bend,y:(a.y+b.y)/2+dx/len*bend}
        return {x:(1-q)*(1-q)*a.x+2*(1-q)*q*c.x+q*q*b.x,y:(1-q)*(1-q)*a.y+2*(1-q)*q*c.y+q*q*b.y}
      }
      function edgeLine(edge,t,alpha=.18,color=COLORS.white,grow=1,outside=0,width=1,freeze=false) {
        const a=pointAt(edge.a,t,freeze,outside), b=pointAt(edge.b,t,freeze,outside),length=Math.hypot(b.x-a.x,b.y-a.y)||1
        const start=(nodes[edge.a].business?19:8)/length, end=Math.min(grow,1-(nodes[edge.b].business?19:8)/length)
        if(end<=start)return
        const hierarchy=edge.kind==='mesh'?.84:1
        ctx.globalAlpha=clamp(alpha*3*hierarchy,0,.92);ctx.strokeStyle=color
        ctx.lineWidth=Math.max(edge.kind==='mesh'?2.8:3.4,width*2.5);ctx.lineCap='round'
        ctx.beginPath()
        const first=edgePoint(edge,t,start,outside,freeze);ctx.moveTo(first.x,first.y)
        const steps=edge.bend?24:1
        for(let i=1;i<=steps;i++){const p=edgePoint(edge,t,lerp(start,end,i/steps),outside,freeze);ctx.lineTo(p.x,p.y)}
        ctx.stroke();ctx.globalAlpha=1
      }

      function network(t, reveal=1, opacity=1, options={}) {
        const zoom=options.zoom || 1, pan=options.pan || 0, outside=options.outside || 0, freeze=options.freeze || false
        const aqua=clamp(options.aqua || 0), orange=clamp(options.orange || 0), positive=clamp(options.positive || 0)
        ctx.save(); ctx.translate(960+pan,540); ctx.scale(zoom,zoom); ctx.translate(-960,-540)
        meshFaces.forEach(face=>{
          if(face.reveal>reveal)return
          const points=face.ids.map(i=>pointAt(i,t,freeze,outside))
          ctx.globalAlpha=face.alpha*opacity
          ctx.fillStyle=options.tint||'#168FAD'

        voice.currentTime=clamp(voice.currentTime+delta,0,handoff);if(!music.error)music.currentTime=voice.currentTime
      }

      function reset() {voice.pause();music.pause();voice.currentTime=0;if(!music.error)music.currentTime=0;started=false;ended=false;subtitle.textContent='';subtitle.classList.remove('on')}

      addEventListener('resize',resize)
      document.querySelector('#restart').addEventListener('click',event=>{event.stopPropagation();reset();begin()})
      pauseButton.addEventListener('click',event=>{event.stopPropagation();if(voice.paused)begin();else{voice.pause();music.pause()}})
      document.querySelector('#skip').addEventListener('click',async event=>{event.stopPropagation();await ready;started=true;voice.currentTime=endTime()})
      addEventListener('click',()=>{if(!started)begin()})
      addEventListener('keydown',event=>{
        if(event.target instanceof HTMLButtonElement && (event.key===' ' || event.key==='Enter'))return
        if(event.key===' '){event.preventDefault();if(!started)begin();else if(voice.paused)begin();else{voice.pause();music.pause()}}
        if(event.key==='ArrowLeft'){event.preventDefault();seek(-2)}
        if(event.key==='ArrowRight'){event.preventDefault();seek(2)}
        if(event.key.toLowerCase()==='r')reset()
        if(event.key.toLowerCase()==='d'){debugOn=!debugOn;debug.classList.toggle('on',debugOn)}
        if(event.key.toLowerCase()==='s')subtitleOn=!subtitleOn
        if(event.key.toLowerCase()==='m'){musicOn=!musicOn;if(!musicOn){music.pause();music.volume=0}else if(started){music.currentTime=voice.currentTime;music.play().catch(()=>{})}}
        if(event.key.toLowerCase()==='f'){event.preventDefault();toggleFullscreen()}
      })
      voice.addEventListener('ended',finish)
      voice.addEventListener('seeking',()=>{if(voice.currentTime<endTime())ended=false})
      music.addEventListener('error',()=>{musicOn=false})

      resize();prepareSprites();buildNetwork();requestAnimationFrame(render)
      // The MP3 is ~44 ms shorter than the cue timeline. Keep its decoded samples and
      // append silence in memory so voice.currentTime can reach the exact final cue.
      async function alignVoiceEnd() {
        if(voice.readyState<1)await new Promise(resolve=>voice.addEventListener('loadedmetadata',resolve,{once:true}))
        if(voice.duration>=endTime())return
        const response=await fetch(cues.ses_dosyasi)
        if(!response.ok)throw new Error('Ses dosyası yüklenemedi')
        const decoder=new OfflineAudioContext(1,1,48000)
        const audio=await decoder.decodeAudioData(await response.arrayBuffer())
        const channels=audio.numberOfChannels, frames=Math.ceil(endTime()*audio.sampleRate)
        const buffer=new ArrayBuffer(44+frames*channels*4), view=new DataView(buffer)
        const label=(offset,text)=>{for(let i=0;i<text.length;i++)view.setUint8(offset+i,text.charCodeAt(i))}
        label(0,'RIFF');view.setUint32(4,buffer.byteLength-8,true);label(8,'WAVE');label(12,'fmt ')
        view.setUint32(16,16,true);view.setUint16(20,3,true);view.setUint16(22,channels,true)
        view.setUint32(24,audio.sampleRate,true);view.setUint32(28,audio.sampleRate*channels*4,true)
        view.setUint16(32,channels*4,true);view.setUint16(34,32,true);label(36,'data');view.setUint32(40,buffer.byteLength-44,true)
        for(let channel=0;channel<channels;channel++) {
          const samples=audio.getChannelData(channel)
          for(let i=0;i<Math.min(samples.length,frames);i++)view.setFloat32(44+(i*channels+channel)*4,samples[i],true)
        }
        const url=URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}))
        const loaded=new Promise(resolve=>voice.addEventListener('loadedmetadata',resolve,{once:true}))
        voice.src=url;voice.load();await loaded
        addEventListener('pagehide',()=>URL.revokeObjectURL(url),{once:true})
      }
      ready=Promise.all([coverReady,fetch('cues.json').then(r=>{if(!r.ok)throw new Error('cues.json yüklenemedi');return r.json()}).then(async data=>{
        cues=data;scenes=data.sahneler;sceneById=new Map(scenes.map((s,i)=>[s.id,i]));await alignVoiceEnd()
      })]).catch(error=>{debug.textContent=error.message;debug.classList.add('on');throw error})
    })()
  </script>
</body>
</html>
